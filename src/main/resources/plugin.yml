name: ZnItem
version: 1.0.0
main: tech.ccat.znitem.ZnItem
api-version: '1.21'
depend: [KStats]
softdepend: [BeMenu]

commands:
  summonitem:
    description: 召唤物品
    usage: /summonitem 或 /summonitem <物品ID> 或 /summonitem <玩家> <物品ID>
    permission: znitem.admin.summon

permissions:
  znitem.admin.summon:
    description: 允许使用summonitem命令
    default: op
